datasets:
  training:
    shards_url: "F:/datasets/sign-language/lsfb-isol/shards/500/shard_{000002..000009}.tar"
    dataloader:
      batch_size: 256
      shuffle: true
      n_workers: 0
    preprocessing:
      targets:
        - 'temporal-segmentation'
#      pose_transforms: [ {name: 'to-image'} ]
      pose_transforms: [ {name: 'islr+flatten3d'} ]
      max_empty_windows: 0

  validation:
    shards_url: "F:/datasets/sign-language/lsfb-isol/shards/500/shard_000001.tar"
    dataloader:
      batch_size: 256
      shuffle: false
      n_workers: 0
    preprocessing:
      targets:
        - 'temporal-segmentation'
#      pose_transforms: [ {name: 'to-image'} ]
      pose_transforms: [ {name: 'islr+flatten3d'} ]
      max_empty_windows: 0

  testing:
    shards_url: "F:/datasets/sign-language/lsfb-isol/shards/500/shard_000000.tar"
    dataloader:
      batch_size: 256
      shuffle: false
      n_workers: 0
    preprocessing:
      targets:
        - 'temporal-segmentation'
#      pose_transforms: [ {name: 'to-image'} ]
      pose_transforms: [ {name: 'islr+flatten3d'} ]
      max_empty_windows: 0


experiment:
  id: "islr/simple/lsfb"
  output_dir: "F:/outputs/simple_islr"
  debug: false
  show_progress_bar: true