from: "base.yaml"


experiment:
  variant: "mstcn_medium/poses_s02_hands+up"
  seed: random


datasets:
  training:
    pose_body_parts: [ "upper_pose", "left_hand", "right_hand" ]
    preprocessing:
      pose_transforms:
        - {
          name: 'norm+flatten2d',
          kwargs: { body_parts: [ "upper_pose", "left_hand", "right_hand" ] }
        }

  validation:
    pose_body_parts: [ "upper_pose", "left_hand", "right_hand" ]
    preprocessing:
      pose_transforms:
        - {
          name: 'norm+flatten2d',
          kwargs: { body_parts: [ "upper_pose", "left_hand", "right_hand" ] }
        }

  testing:
    pose_body_parts: [ "upper_pose", "left_hand", "right_hand" ]
    preprocessing:
      pose_transforms:
        - {
          name: 'norm+flatten2d',
          kwargs: { body_parts: [ "upper_pose", "left_hand", "right_hand" ] }
        }


model:
  name: 'hydra'
  backbone:
    name: "ms-tcn"
    kwargs:
      in_channels: 130 # = upper_body + left/right_hand (65 x 2d)
      out_channels: 4
      hidden_channels: 64
      n_stages: 4
      n_layers: 10
  heads:
    classification:
      name: "identity"
      n_channels: 2
    regression:
      name: "identity"
      n_channels: 2
